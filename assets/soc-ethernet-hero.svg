<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">DE10-Standard SoC Ethernet portfolio banner</title>
  <desc id="desc">Self-hosted SVG banner for the DE10-Standard Cyclone V SoC Ethernet project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="42%" stop-color="#0f766e"/>
      <stop offset="72%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes float { 0%,100% { transform: translateY(0); opacity:.84; } 50% { transform: translateY(-9px); opacity:1; } }
      @keyframes blink { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .kicker { font: 700 18px Segoe UI, Arial, sans-serif; fill:#a7f3d0; letter-spacing:0; }
      .title { font: 850 54px Segoe UI, Arial, sans-serif; fill:#ffffff; letter-spacing:0; }
      .sub { font: 650 22px Segoe UI, Arial, sans-serif; fill:#dbeafe; letter-spacing:0; }
      .mono { font: 700 17px Consolas, monospace; fill:#f8fafc; }
      .card { fill:rgba(15,23,42,.70); stroke:rgba(255,255,255,.28); stroke-width:1.3; }
      .label { font: 800 18px Segoe UI, Arial, sans-serif; fill:#ecfeff; }
      .wire { fill:none; stroke:url(#wire); stroke-width:5; stroke-linecap:round; filter:url(#glow); }
      .trace { fill:none; stroke:url(#wire); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; filter:url(#glow); }
      .chip { fill:rgba(15,23,42,.56); stroke:rgba(255,255,255,.26); stroke-width:1.4; }
      .pin { fill:#fef3c7; filter:url(#glow); animation:blink 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <g opacity=".14">
    <path d="M0 84 H1200M0 168 H1200M0 252 H1200M120 0 V340M240 0 V340M360 0 V340M480 0 V340M600 0 V340M720 0 V340M840 0 V340M960 0 V340M1080 0 V340" stroke="#e0f2fe" stroke-width="1"/>
  </g>
  <g transform="translate(72 72)">
    <text class="kicker" x="0" y="0">HCMUS FETEL - Embedded Systems Practice</text>
    <text class="title" x="0" y="72">DE10-Standard SoC Ethernet</text>
    <text class="sub" x="0" y="112">PC / Android TCP command path to HPS Linux, FPGA bridge and HEX display</text>
    <text class="mono" x="0" y="178">Cyclone V SoC - HPS Linux - TCP:5000 - Lightweight Bridge - HEX0..HEX5</text>
  </g>
  <g opacity=".92" transform="translate(820 188)">
    <path class="trace" d="M0 28 H74 V8 H150 V48 H238"/>
    <path class="trace" d="M18 98 H106 V74 H182 V112 H316" style="animation-delay:.6s"/>
    <path class="trace" d="M52 62 H136 V28 H278" style="animation-delay:1.1s"/>
    <rect class="chip" x="236" y="16" width="168" height="106" rx="22"/>
    <rect class="chip" x="274" y="44" width="92" height="50" rx="14" opacity=".82"/>
    <circle class="pin" cx="74" cy="28" r="6"/>
    <circle class="pin" cx="150" cy="48" r="6" style="animation-delay:.3s"/>
    <circle class="pin" cx="106" cy="98" r="6" style="animation-delay:.7s"/>
    <circle class="pin" cx="182" cy="112" r="6" style="animation-delay:1s"/>
    <circle class="pin" cx="278" cy="62" r="6" style="animation-delay:1.3s"/>
  </g>
</svg>
