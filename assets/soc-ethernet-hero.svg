<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Line-free SoC Ethernet portfolio banner</title>
  <desc id="desc">ASCII-safe English SVG banner for the DE10-Standard Cyclone V SoC Ethernet project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="54%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <style>
      .title { font: 850 48px Segoe UI, Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font: 650 21px Segoe UI, Arial, sans-serif; fill: #dbeafe; letter-spacing: 0; }
      .label { font: 800 18px Segoe UI, Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .detail { font: 650 14px Segoe UI, Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .mono { font: 700 17px Consolas, monospace; fill: #f8fafc; letter-spacing: 0; }
      .caption { font: 700 15px Segoe UI, Arial, sans-serif; fill: #e2e8f0; letter-spacing: 0; }
      .panel { fill: rgba(15,23,42,.58); stroke: rgba(255,255,255,.22); stroke-width: 1.4; }
      .chip { animation: chipPulse 4.2s ease-in-out infinite; transform-origin: center; }
      .soft { animation: softPulse 5.8s ease-in-out infinite; transform-origin: center; }
      @keyframes chipPulse { 0%, 100% { opacity: .78; transform: scale(.99); } 50% { opacity: 1; transform: scale(1.02); } }
      @keyframes softPulse { 0%, 100% { opacity: .74; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="36" y="32" width="1128" height="296" rx="24" class="panel"/>
  <text x="72" y="76" class="title">DE10-Standard SoC Ethernet</text>
  <text x="74" y="114" class="subtitle">PC and Android TCP clients to HPS Linux, FPGA bridge and HEX display.</text>
  <rect x="72" y="142" width="642" height="42" rx="16" fill="rgba(15,23,42,.64)"/>
  <text x="96" y="169" class="mono">TCP:5000 | Cyclone V | HPS Linux | PIO | HEX0..HEX5</text>
  <g>
    <g class="chip">
      <rect x="80" y="226" width="180" height="64" rx="18" fill="#e0f2fe"/>
      <text x="170" y="253" text-anchor="middle" class="label">PC Client</text>
      <text x="170" y="275" text-anchor="middle" class="detail">Python GUI</text>
    </g>
    <g class="chip" style="animation-delay:.2s">
      <rect x="286" y="226" width="180" height="64" rx="18" fill="#dcfce7"/>
      <text x="376" y="253" text-anchor="middle" class="label">TCP Service</text>
      <text x="376" y="275" text-anchor="middle" class="detail">LAN port 5000</text>
    </g>
    <g class="chip" style="animation-delay:.4s">
      <rect x="492" y="226" width="180" height="64" rx="18" fill="#fef9c3"/>
      <text x="582" y="253" text-anchor="middle" class="label">HPS Linux</text>
      <text x="582" y="275" text-anchor="middle" class="detail">Payload server</text>
    </g>
    <g class="chip" style="animation-delay:.6s">
      <rect x="698" y="226" width="180" height="64" rx="18" fill="#fee2e2"/>
      <text x="788" y="253" text-anchor="middle" class="label">FPGA Bridge</text>
      <text x="788" y="275" text-anchor="middle" class="detail">PIO writes</text>
    </g>
    <g class="chip" style="animation-delay:.8s">
      <rect x="904" y="226" width="180" height="64" rx="18" fill="#dbeafe"/>
      <text x="994" y="253" text-anchor="middle" class="label">HEX Display</text>
      <text x="994" y="275" text-anchor="middle" class="detail">Six characters</text>
    </g>
  </g>
  <g class="soft">
    <rect x="820" y="74" width="268" height="116" rx="22" fill="rgba(248,250,252,.92)"/>
    <text x="954" y="112" text-anchor="middle" class="label">Portfolio Evidence</text>
    <text x="954" y="142" text-anchor="middle" class="detail">Release-backed README</text>
    <text x="954" y="166" text-anchor="middle" class="detail">Line-free visual assets</text>
  </g>
  <text x="600" y="316" text-anchor="middle" class="caption">ASCII-safe SVG text. No connector lines. No dotted motion. No text behind decorative paths.</text>
</svg>
