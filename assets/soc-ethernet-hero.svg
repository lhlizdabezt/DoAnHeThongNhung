<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">DE10-Standard SoC Ethernet portfolio banner</title>
  <desc id="desc">Self-hosted SVG banner for the DE10-Standard Cyclone V SoC Ethernet project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="42%" stop-color="#0f766e"/>
      <stop offset="72%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes dash { to { stroke-dashoffset: -240; } }
      @keyframes float { 0%,100% { transform: translateY(0); opacity:.84; } 50% { transform: translateY(-9px); opacity:1; } }
      @keyframes blink { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .kicker { font: 700 18px Segoe UI, Arial, sans-serif; fill:#a7f3d0; letter-spacing:0; }
      .title { font: 850 54px Segoe UI, Arial, sans-serif; fill:#ffffff; letter-spacing:0; }
      .sub { font: 650 22px Segoe UI, Arial, sans-serif; fill:#dbeafe; letter-spacing:0; }
      .mono { font: 700 17px Consolas, monospace; fill:#f8fafc; }
      .card { fill:rgba(15,23,42,.70); stroke:rgba(255,255,255,.28); stroke-width:1.3; }
      .label { font: 800 18px Segoe UI, Arial, sans-serif; fill:#ecfeff; }
      .wire { fill:none; stroke:url(#wire); stroke-width:5; stroke-linecap:round; stroke-dasharray:22 16; animation:dash 3.4s linear infinite; filter:url(#glow); }
    </style>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <g opacity=".14">
    <path d="M0 84 H1200M0 168 H1200M0 252 H1200M120 0 V340M240 0 V340M360 0 V340M480 0 V340M600 0 V340M720 0 V340M840 0 V340M960 0 V340M1080 0 V340" stroke="#e0f2fe" stroke-width="1"/>
  </g>
  <g transform="translate(72 72)">
    <text class="kicker" x="0" y="0">HCMUS FETEL - Embedded Systems Practice</text>
    <text class="title" x="0" y="72">DE10-Standard SoC Ethernet</text>
    <text class="sub" x="0" y="112">PC / Android TCP command path to HPS Linux, FPGA bridge and HEX display</text>
    <text class="mono" x="0" y="178">Cyclone V SoC - HPS Linux - TCP:5000 - Lightweight Bridge - HEX0..HEX5</text>
  </g>
  <path class="wire" d="M708 102 H782 Q806 102 806 128 H878 Q902 128 902 154 H984"/>
  <path class="wire" d="M708 236 H790 Q812 236 812 210 H882 Q906 210 906 184 H986" style="animation-delay:.6s"/>
  <g style="animation:float 5.4s ease-in-out infinite">
    <rect class="card" x="668" y="62" width="116" height="56" rx="16"/>
    <text class="label" x="704" y="97">TCP</text>
  </g>
  <g style="animation:float 5.8s ease-in-out infinite">
    <rect class="card" x="818" y="92" width="134" height="56" rx="16"/>
    <text class="label" x="853" y="127">HPS</text>
  </g>
  <g style="animation:float 6.2s ease-in-out infinite">
    <rect class="card" x="992" y="126" width="126" height="56" rx="16"/>
    <text class="label" x="1028" y="161">FPGA</text>
  </g>
  <g style="animation:float 6.6s ease-in-out infinite">
    <rect class="card" x="698" y="208" width="118" height="56" rx="16"/>
    <text class="label" x="728" y="243">GUI</text>
  </g>
  <g style="animation:float 7s ease-in-out infinite">
    <rect class="card" x="846" y="178" width="148" height="56" rx="16"/>
    <text class="label" x="880" y="213">Bridge</text>
  </g>
  <g style="animation:float 7.4s ease-in-out infinite">
    <rect class="card" x="1012" y="220" width="124" height="56" rx="16"/>
    <text class="label" x="1046" y="255">HEX</text>
  </g>
  <g fill="#fef3c7" filter="url(#glow)">
    <circle cx="806" cy="128" r="6" style="animation:blink 2s ease-in-out infinite"/>
    <circle cx="902" cy="154" r="6" style="animation:blink 2.4s ease-in-out infinite"/>
    <circle cx="812" cy="210" r="6" style="animation:blink 2.8s ease-in-out infinite"/>
    <circle cx="906" cy="184" r="6" style="animation:blink 2.2s ease-in-out infinite"/>
  </g>
</svg>
